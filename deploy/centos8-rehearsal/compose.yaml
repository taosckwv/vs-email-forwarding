# =============================================================================
# CentOS 8 离线部署**预演**环境（用 almalinux:8 模拟 RHEL 8 / CentOS 8 用户态）
#
# 目的：在开发机上先把「离线交付流程」在接近现场的 shell 里走一遍，
#       提前暴露用户态与运行环境差异。**不跑单元测试**（测试在开发机跑，
#       见 scripts/check.ps1 / check.sh）——理由见同目录 README.md。
#
# 用法：
#     docker compose -f deploy/centos8-rehearsal/compose.yaml up -d
#     docker compose -f deploy/centos8-rehearsal/compose.yaml exec rehearsal bash
#     docker compose -f deploy/centos8-rehearsal/compose.yaml down
#
# 为什么用 almalinux:8：
#   * 与 RHEL 8 / CentOS 8 同 ABI（glibc 2.28），仍在活跃维护（8.10，dnf 源可用）；
#   * 备选 rockylinux/rockylinux:8（冻结在 8.10，repo 在线）；
#   * **不要**用 library/rockylinux:8（停在 8.9），**不要**用 centos:8
#     （仍可 pull，但实为 8.4.2105，且全部 tag EOL、只剩 vault、无安全更新）。
# =============================================================================

name: mail-relay-rehearsal

services:
  # ---------------------------------------------------------------------------
  # 空壳的 RHEL 8 用户态环境：只挂载交付目录，用来手动执行交付流程的脚本片段。
  # 里面**不装 Python、不装 uv**（这是硬性要求：服务器上也没有这两样）。
  # ---------------------------------------------------------------------------
  rehearsal:
    image: almalinux:8
    container_name: mail-relay-rehearsal
    # 与交付镜像同架构，避免在 arm64 开发机上得出不可比的结论。
    # 该字段只是运行期保险（架构由构建期决定），并依赖 compose v2。
    platform: linux/amd64
    # 常驻不退出，等着被 exec 进去
    command: ["/bin/bash", "-c", "sleep infinity"]
    stdin_open: true
    tty: true
    working_dir: /delivery
    volumes:
      # 交付目录只读挂载：仓库根（含 compose.yaml、.env.example、deploy/、dist/）。
      # 只读是故意的——预演不该改动仓库里的任何东西。
      # 若 tar 放在仓库外（例如 D:\delivery），把它改成绝对路径即可。
      - ../../:/delivery:ro
      # 需要临时写文件（解 tar、算 sha256 输出）时用容器内 /tmp，或临时加一个可写挂载：
      # - ${REHEARSAL_SCRATCH:-./.rehearsal-tmp}:/scratch
      #
      # 如果确实要在容器内直接调用宿主 Docker（需要容器内有 docker CLI，
      # 而本镜像里没有，也未联网安装），可以挂 socket —— 默认**不开**，
      # 因为把 docker.sock 交给一个空壳容器等于给出 root 级权限：
      # - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rehearsal

networks:
  rehearsal:
    name: mail-relay-rehearsal-net
    driver: bridge

# 说明：本文件**不包含** app / postgres 服务。
#   预演的核心不是"再跑一遍服务"，而是：
#     1) 验证交付脚本在 RHEL 8 用户态（bash / coreutils / tar / sha256sum / dnf）下的行为；
#     2) 验证 tar 的可解性、sha256 可校验性、文件名全 ASCII；
#     3) 暴露 SELinux / cgroup / Docker 版本等环境差异。
#   真正的镜像启动、迁移、健康检查在**宿主机**上按 deploy/README.md 执行。
