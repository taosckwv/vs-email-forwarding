# Alembic 配置：**本文件不写连接串**。
#
# 连接串的取值在 migrations/env.py 里决定：优先环境变量 DATABASE_URL（集成测试用「环境变量覆盖、
# 不改仓库配置」的口径），未设时回落到 vs_email_forwarding.config.get_settings().database_url
# ——唯一配置入口，读 .env。把 URL 写进本文件等于造出第二处连接串来源，也会让集成测试无从覆盖。
#
# 命令一律在**仓库根目录**执行，例如：
#     uv run alembic -c migrations/alembic.ini upgrade head
# 生产与预演环境不手工跑 Alembic：迁移入口只有一个，`deploy/migrate.sh`
# （见 migrations/README.md 的「约定」）。

[alembic]
# 迁移脚本目录（相对仓库根目录）。
script_location = migrations

# 迁移文件名模板：<revision>_<slug>.py，例如 0001_create_mail_tables.py。
# revision 用 `--rev-id` 指定为四位序号（口径见 migrations/README.md 的「约定」第 3 条）。
file_template = %%(rev)s_%%(slug)s

# 命令在仓库根目录执行，因此把当前目录放进 sys.path；包本身由 uv 以可编辑方式安装。
prepend_sys_path = .

# 列表类配置项（version_locations / prepend_sys_path）用 os.pathsep 分隔。
path_separator = os

# 连接串刻意留空、也不填占位值：取值只由 migrations/env.py 从环境变量或配置层取。
# sqlalchemy.url =

# 日志配置：由 migrations/env.py 的 fileConfig() 消费（alembic init 的模板段，原样保留）。
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
