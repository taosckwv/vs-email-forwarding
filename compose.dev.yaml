# =============================================================================
# vs-email-forwarding 开发依赖编排 —— 只起基础设施，不起应用
#
# 为什么不起应用：开发时服务在宿主机上用 uv 跑（`uv run uvicorn vs_email_forwarding.main:app
# --reload`），代码改动即时生效；把应用塞进容器会让热重载与调试变麻烦。
# 一键起依赖：scripts/dev-up.sh。
#
#   docker compose -f compose.dev.yaml up -d
#
# 前提：本机已安装并启动 Docker（开发机是 CentOS 8 Linux 虚拟机，已装 26.1.3）。
#
# 邮件服务用 GreenMail（不是 Mailpit）：本项目流③必须用 IMAP 拉取回复，而 Mailpit
# 不提供 IMAP（只有 SMTP / Web UI / POP3，上游 issue #587、#730 均 not_planned）。
# GreenMail 同时提供 SMTP 与 IMAP，本地才能跑通「发出去 → 被拉回来 → 关联上原邮件」。
# 决策与实测证据见 docs/research/05-dev-and-build-environment.md（D16 已由此关闭）。
# =============================================================================

name: vs-email-forwarding-dev

services:
  # ---------------------------------------------------------------------------
  # 开发数据库：数据放**命名卷**，不要放进项目目录
  #   * 项目目录是 git 仓库，数据文件进去会被 git 盯上（.gitignore 兜得住但脏）；
  #   * 命名卷删起来干净：docker compose -f compose.dev.yaml down -v
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17
    container_name: vs-email-forwarding-dev-postgres
    # platform 只是**运行期保险**（开发机上与生产同架构，行为更可比）；
    # 真正决定镜像架构的是构建期（服务器侧构建脚本的 `docker build --platform`）。
    # 该字段依赖 compose v2（`docker compose version` 确认）。在 arm64 开发机
    # （Apple Silicon）上会走模拟，慢一些但结果可比。
    platform: linux/amd64
    environment:
      POSTGRES_USER: vs_email_forwarding
      # 仅本地开发用的固定弱口令，禁止出现在生产 .env 里
      POSTGRES_PASSWORD: vs_email_forwarding_dev
      # 开发主库。测试库 vs_email_forwarding_test 见文件末尾的"开发/测试库初始化"说明。
      POSTGRES_DB: vs_email_forwarding_dev
      TZ: UTC
    ports:
      # 开发机需要从宿主机（uv 跑的应用、本机 psql/DBeaver）连库，所以这里暴露 5432。
      # 只绑回环，避免同一个 Wi-Fi 下的其他人连进你的开发库。
      - "127.0.0.1:5432:5432"
    volumes:
      - vs-email-forwarding-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vs_email_forwarding -d vs_email_forwarding_dev -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - vs-email-forwarding-dev

  # ---------------------------------------------------------------------------
  # GreenMail：本地假邮件服务器，SMTP + IMAP + POP3 齐全（Java，2.1.14）
  #
  # 它验证的是**完整回路**，而不只是"能发信"：
  #   应用发信（SMTP 3025）-> GreenMail 按收件人分信箱收下 -> 应用用 IMAP（3143）
  #   以该信箱账号登录、把"回复"拉回来 -> 用 References / In-Reply-To 关联回原邮件。
  # 官方镜像启动参数自带 `-Dgreenmail.auth.disabled`，因此**任意账号口令都能登录**，
  # 本地开发不必配真凭据；测试邮件只进这个容器，不会发到外网。
  #
  # 三个必须知道的行为（实测，见 docs/research/05-dev-and-build-environment.md）：
  #   * **按账号分信箱**：投给 reply@example.com 的信，要用该账号登录 IMAP 才看得到
  #     （Mailpit 是全局一个收件箱）——这正好贴合 IMAP_USERNAME 的用法。
  #   * **消息只活在容器生命周期里**：没有挂数据卷，`down` 之后信箱自然清空，
  #     集成测试不必担心上一轮的信残留（想保留就自己加卷）。
  #   * 端口与 Mailpit 完全不同：SMTP 3025 / IMAP 3143（另有 SMTPS 3465、IMAPS 3993）。
  # ---------------------------------------------------------------------------
  greenmail:
    # 锁到具体小版本（与 latest 同 digest：sha256:1ef95a96…）；开发依赖也锁版本，
    # 不锁会让"本机能过、同事跑不过"。
    image: greenmail/standalone:2.1.14
    container_name: vs-email-forwarding-dev-greenmail
    # 与生产同架构的**运行期保险**（架构由构建期决定），并依赖 compose v2
    platform: linux/amd64
    environment:
      TZ: UTC
    ports:
      # SMTP：应用发信用（同时用来模拟"同事的回复"投递进来）
      - "127.0.0.1:3025:3025"
      # IMAP：应用拉取入站回复用
      - "127.0.0.1:3143:3143"
      # POP3：想在常用邮件客户端里看收下的信时用（应用不用它）
      - "127.0.0.1:3110:3110"
      # 需要看/灌邮件时再放开：GreenMail 的 HTTP API（无 Web UI，Mailpit 那种界面没有）
      # - "127.0.0.1:8080:8080"
    networks:
      - vs-email-forwarding-dev

# -----------------------------------------------------------------------------
# 开发用命名卷（与生产不同：生产数据在宿主机目录 ./data/postgres，见 compose.yaml）
# -----------------------------------------------------------------------------
volumes:
  vs-email-forwarding-dev-postgres:
    name: vs-email-forwarding-dev-postgres

networks:
  vs-email-forwarding-dev:
    name: vs-email-forwarding-dev-net
    driver: bridge

# =============================================================================
# 开发库与测试库的初始化
#
#   * 开发库 vs_email_forwarding_dev：由 POSTGRES_DB 在**首次**初始化数据卷时自动创建。
#   * 测试库 vs_email_forwarding_test：官方 postgres 镜像**不支持** POSTGRES_MULTIPLE_DATABASES
#     这种多库参数（那是 bitnami 等第三方镜像的扩展）。只有一个库会被自动建出来，
#     第二个库用下面两条命令之一手工建（只做一次，数据卷在就不用重做）：
#
#       docker compose -f compose.dev.yaml exec postgres \
#         psql -U vs_email_forwarding -d postgres -c "CREATE DATABASE vs_email_forwarding_test OWNER vs_email_forwarding;"
#
#     或者从宿主机连（需要本机装了 psql 客户端）：
#
#       psql "postgresql://vs_email_forwarding:vs_email_forwarding_dev@127.0.0.1:5432/postgres" \
#         -c "CREATE DATABASE vs_email_forwarding_test OWNER vs_email_forwarding;"
#
#   * 注意：docker-entrypoint-initdb.d 里的初始化脚本只在数据卷**首次**初始化时执行，
#     卷已存在时再改脚本不会生效——要么手工执行上面的 SQL，要么 down -v 重建卷。
#   * 集成测试（tests/integration/）用 vs_email_forwarding_test，避免把开发数据洗掉；
#     测试用的连接串同样从 .env 读（键名以 .env.example 为准）。
#
# 应用本体在开发机上怎么跑（不通过本文件）：
#
#   uv sync
#   uv run uvicorn vs_email_forwarding.main:app --reload
#
#   注意 .env 里的 DATABASE_URL 要指向本地开发库（应用跑在宿主机上，
#   所以主机名用 127.0.0.1，与生产用服务名 postgres 的写法不同）：
#     DATABASE_URL=postgresql+asyncpg://vs_email_forwarding:vs_email_forwarding_dev@127.0.0.1:5432/vs_email_forwarding_dev
#   同理 SMTP/IMAP 指向 GreenMail：
#     SMTP_HOST=127.0.0.1  SMTP_PORT=3025  SMTP_STARTTLS=false
#     IMAP_HOST=127.0.0.1  IMAP_PORT=3143
#   注意 SMTP_STARTTLS=false：GreenMail 的 3025 是明文端口（STARTTLS 在 3465 的 smtps 上）。
#
#   # 如果确实想连容器里的应用冒烟（可选，需先在本机构建镜像）：
#   # app:
#   #   image: ${VS_EMAIL_FORWARDING_IMAGE:-vs-email-forwarding:latest}
#   #   env_file: [.env]
#   #   ports: ["${HTTP_PORT:-8000}:8000"]
#   #   depends_on:
#   #     postgres: { condition: service_healthy }
#   #   networks: [vs-email-forwarding-dev]
# =============================================================================
