# ============================================================================
# mail-relay 工程配置
# 说明：包名 mail_relay / mail-relay 为占位名，最终命名尚未确定。
# 任何对本文件的修改（依赖、lint 规则、门禁开关）都属于不可逆决策，
# 请先在 docs/adr/ 留下决策记录。
# ============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mail-relay"
version = "0.1.0"
description = "邮件中转服务：接收投递请求，经安全审查与定时轮询后完成收发与回复回收。"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sckwv" }]
keywords = ["mail", "relay", "smtp", "imap", "fastapi"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    # 本仓库不对外发布：默认不上传到 PyPI 等公开索引。
    "Private :: Do Not Upload",
]

# 运行时依赖：预研阶段只保留最小集，新增依赖前先补 ADR。
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "structlog",
]

# 开发依赖：uv 原生 dependency-groups 写法。
# 注意：httpx 是 FastAPI TestClient 的必需依赖，不是运行时依赖。
[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pre-commit",
    "commitizen",
]

[tool.uv]
# src 布局的单包仓库，需要按包安装（而不是把仓库根当虚拟项目）。
package = true

# ---------------------------------------------------------------------------
# ruff：格式化 + lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff 自有规则
]
ignore = [
    # 行宽交给 ruff format 负责，避免 E501 与格式化器互相打架。
    "E501",
    # 中文标点例外：本仓库强制要求注释、docstring 与面向用户的描述字符串使用中文，
    # 而这三条规则把全角中文标点（：；，（））判定为「与 ASCII 混淆的歧义字符」。
    # 实测首次跑门禁时 176 处告警全部来自中文注释/docstring，零处来自代码逻辑。
    # 这是「中文内容」这一既定决策与规则前提的冲突，不是「为了过门禁而放宽」，
    # 决策与代价记录在 docs/adr/0011-chinese-punctuation-and-ruf-rules.md。
    # 除这三条外，其余 lint 规则一律不放宽。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["mail_relay"]

[tool.ruff.format]
# 使用 ruff format 默认风格。

# ---------------------------------------------------------------------------
# mypy：要求类型标注完整
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src"]
plugins = ["pydantic.mypy"]

# 核心 strict 开关
disallow_untyped_defs = true
disallow_incomplete_defs = true

# 噪音与安全网
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true

# 第三方库缺失类型时的行为，保持显式
ignore_missing_imports = false

# 说明：预研阶段暂不放宽任何第三方库的类型检查。
# 若某个库确实缺少类型存根，必须先在 docs/adr/ 记录理由，
# 再在 [[tool.mypy.overrides]] 中按 module 精确放行，不要整体关闭。

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

# ---------------------------------------------------------------------------
# commitizen：只做提交信息校验与辅助发版；版本号与 CHANGELOG 手工维护。
# ---------------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
update_changelog_on_bump = true
version_files = ["pyproject.toml:version"]
