# ============================================================================
# vs-email-forwarding 工程配置
# 说明：包名 vs_email_forwarding / vs-email-forwarding 的定名结论见 docs/research/06-naming-licensing-and-governance.md。
# 任何对本文件的修改（依赖、lint 规则、门禁开关）都属于不可逆决策，
# 请先在 docs/research/ 下对应的主题册留下决策记录（见 AGENTS.md §6）。
# ============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vs-email-forwarding"
version = "0.1.0"
description = "邮件中转服务：接收投递请求，经安全审查与定时轮询后完成收发与回复回收。"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sckwv" }]
keywords = ["mail", "relay", "smtp", "imap", "fastapi"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    # 本仓库不对外发布：默认不上传到 PyPI 等公开索引。
    "Private :: Do Not Upload",
]

# 运行时依赖：预研阶段只保留最小集，新增依赖前先在 docs/research/03-dependencies-and-toolchain.md 记录结论。
dependencies = [
    "alembic",
    "asyncpg",
    "fastapi",
    "imapclient",
    "pydantic-settings",
    # [asyncio] extra：异步引擎与 AsyncSession 需要 greenlet，而 greenlet 由 SQLAlchemy
    # 自身的 extra 声明（不引入新上游）。实测证据见
    # docs/research/03-dependencies-and-toolchain.md。
    "sqlalchemy[asyncio]",
    "structlog",
    "uvicorn[standard]",
]

# 开发依赖：uv 原生 dependency-groups 写法。
# 注意：httpx 是 FastAPI TestClient 的必需依赖，不是运行时依赖。
# pytest-cov 与 mutmut 是测试质量的度量工具（覆盖率 / 变异测试），同样不是运行时依赖；
# 引入理由、门禁判据与许可实测见 docs/research/03-dependencies-and-toolchain.md，
# 测试侧规则见 docs/testing.md。
[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pre-commit",
    "commitizen",
    "pytest-cov",
    "mutmut",
]

[tool.uv]
# src 布局的单包仓库，需要按包安装（而不是把仓库根当虚拟项目）。
package = true

# ---------------------------------------------------------------------------
# ruff：格式化 + lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff 自有规则
]
ignore = [
    # 行宽交给 ruff format 负责，避免 E501 与格式化器互相打架。
    "E501",
    # 中文标点例外：本仓库强制要求注释、docstring 与面向用户的描述字符串使用中文，
    # 而这三条规则把全角中文标点（：；，（））判定为「与 ASCII 混淆的歧义字符」。
    # 默认配置下 `ruff check` 无告警；把这三条从 ignore 中暂时移出后，同一份代码命中 314 处
    # （RUF002 191 / RUF001 92 / RUF003 31），零处来自其他规则——这正是只 ignore 这三条的依据。
    # 这是「中文内容」这一既定决策与规则前提的冲突，不是「为了过门禁而放宽」，
    # 决策与代价记录在 docs/research/03-dependencies-and-toolchain.md（「ruff 的规则取舍」一节里的 RUF001/002/003 例外）。
    # 除这三条外，其余 lint 规则一律不放宽。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["vs_email_forwarding"]

[tool.ruff.format]
# 使用 ruff format 默认风格。

# ---------------------------------------------------------------------------
# mypy：要求类型标注完整
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src"]
plugins = ["pydantic.mypy"]

# 核心 strict 开关
disallow_untyped_defs = true
disallow_incomplete_defs = true

# 噪音与安全网
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true

# 第三方库缺失类型时的行为，保持显式
ignore_missing_imports = false

# 说明：预研阶段暂不放宽任何第三方库的类型检查。
# 若某个库确实缺少类型存根，必须先在 docs/research/ 下对应的主题册记录理由（见 AGENTS.md §6），
# 再在 [[tool.mypy.overrides]] 中按 module 精确放行，不要整体关闭。
#
# 唯一的放行是 imapclient：它的包目录下没有 py.typed，在 src/ 下 import 后 mypy 报
# import-untyped（实测依据见 docs/research/03-dependencies-and-toolchain.md），因此按
# module 精确放行（下方 [[tool.mypy.overrides]]）。asyncpg 同样没有 py.typed，但此刻没有
# 任何模块 import 它，而 [[tool.mypy.overrides]] 在无对应 import 时会被 mypy 报成
# unused section，因此它的放行与第一个真正 import 它的模块同一次改动落地。只覆盖实测报
# import-untyped 的 module，不放宽同样新增、但自带 py.typed 的 sqlalchemy 与 alembic。

[[tool.mypy.overrides]]
module = ["imapclient", "imapclient.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
# 集成测试用例必须打 @pytest.mark.integration（未登记的标记会触发 PytestUnknownMarkWarning）。
# 标记约定与「容器未起时为什么跳过、跳过不等于通过」见 docs/testing.md §8。
markers = [
    "integration: 需要真实 PostgreSQL 与邮件服务（由 scripts/dev-up.sh 提供）；容器未起时跳过",
]

# ---------------------------------------------------------------------------
# 覆盖率（pytest-cov）：只作诊断，不设门槛
# 它暴露「没有任何测试执行到」的行；判据与「为什么不做验收门槛」见
# docs/research/03-dependencies-and-toolchain.md 的「测试质量的度量口径」。
# 命令在 scripts/check.sh 的第 4 步，不写进 addopts：门禁怎么跑只允许有一个出处。
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["vs_email_forwarding"]
branch = true

[tool.coverage.report]
# 与变异测试的分工：覆盖率暴露「没被执行到的行」，
# mutmut 暴露「执行了但没有被断言验证的行」（见下方 [tool.mutmut]）。
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# ---------------------------------------------------------------------------
# 变异测试（mutmut）：证明断言真的能失败
# 范围固定为 tests/unit —— 门禁结论不得随容器是否启动而改变。
# 门禁判据（三条结构性红线，不设百分比阈值）在 scripts/check.sh，
# 依据见 docs/research/03-dependencies-and-toolchain.md。
# ---------------------------------------------------------------------------
[tool.mutmut]
source_paths = ["src/vs_email_forwarding"]
pytest_add_cli_args_test_selection = ["tests/unit"]
# 只变异被测试执行到的行：此时「存活变异」= 执行过但没有被断言验证的缺口。
mutate_only_covered_lines = true

# ---------------------------------------------------------------------------
# commitizen：只做提交信息校验与辅助发版；版本号与 CHANGELOG 手工维护。
# ---------------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
update_changelog_on_bump = true
version_files = ["pyproject.toml:version"]
