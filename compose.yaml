# =============================================================================
# vs-email-forwarding 生产编排（应用 + 同机 PostgreSQL，同一个 compose 管理）
#
# 用法（在服务器交付目录里，与 .env、deploy/ 同级）：
#   docker compose -f compose.yaml up -d
# 或者直接用仓库自带的脚本：deploy/run.sh
#
# 交付方式（见 docs/research/01-delivery-and-deploy.md）：镜像**在 CentOS 8 生产服务器上本地构建**，
# 基础镜像以镜像 tar 形式从外部带入服务器并 `docker load`。
# 环境前提：**与公网隔离、可达内网镜像源；运行时不得依赖任何外部网络**。
# 所以本文件**只写 image、不写 build**：构建在服务器上单独进行——消费侧三件脚本
# （迁移 / 启动 + `/healthz` 探活 / 交付前归档自检）**已交付**，用法与判据出处见
# `deploy/README.md`；仍未落地的只是**镜像构建脚本**（含基础镜像 tar 的导出与带入），
# 属未定项，见 `docs/open-questions.md` D2。compose 只负责把已 load 到本地的镜像跑起来。
# 镜像名用 ${VS_EMAIL_FORWARDING_IMAGE} 是为了 load 后能指定具体版本 tag（便于回滚）。
#
# 前提：服务器上必须是 Docker Compose v2（`docker compose` 子命令）。
#   本文件不含 `version:` 字段（Compose Spec），并且用到了
#   depends_on.condition: service_healthy —— compose v1（python 版
#   docker-compose）不支持这两点。上服务器先跑 `docker compose version` 确认。
#
# 服务名与容器名一律 ASCII；日志、凭据、收件人地址不进本文件（见 AGENTS.md §8）。
# =============================================================================

name: vs-email-forwarding

services:
  # ---------------------------------------------------------------------------
  # 应用：FastAPI + 4 条进程内 asyncio 轮询流（间隔由 .env 里的配置项控制）
  # ---------------------------------------------------------------------------
  app:
    # 与公网隔离的服务器上，镜像已由载入脚本 load 到本地，用变量指定具体版本 tag；
    # 回滚 = 改这个变量成旧 tag 再 up -d（见 docs/research/01-delivery-and-deploy.md「维护与回滚」）。
    # 镜像 tag 由 .env 的 VS_EMAIL_FORWARDING_IMAGE 指定（该键就在 .env.example 里，
    #    例如 VS_EMAIL_FORWARDING_IMAGE=vs-email-forwarding:0.1.0）。不写则退回下面的 latest 默认值。
    image: ${VS_EMAIL_FORWARDING_IMAGE:-vs-email-forwarding:latest}
    container_name: vs-email-forwarding-app
    # platform 字段在这里只是**运行期保险**，不是架构的真正保证：
    #   * 真正决定镜像架构的是**构建期**（服务器侧构建脚本里的
    #     `docker build --platform linux/amd64`——该脚本的形态仍是未定项，见
    #     docs/open-questions.md D2）；写在这里只能让 compose 在
    #     「镜像架构与声明不符」时更早报错，并不会把镜像变成 amd64；
    #   * 交付链的 save / load **不带** `--platform`：服务器实测 Client / Server 均为
    #     26.1.3、API 1.45，而该参数需要 v28+ / API 1.48；架构改为在 tar 进入服务器之前
    #     与载入之后各校验一次（判据见 docs/research/01-delivery-and-deploy.md）；
    #   * 本字段依赖 **compose v2**（用 `docker compose version` 确认）。Engine 26
    #     自带 compose v2 插件，但这一点**仍需现场确认**。
    platform: linux/amd64
    # 应用的全部可变配置都收敛在 .env（HTTP_PORT、数据库连接、SMTP/IMAP、
    # 四条流的轮询间隔等），仓库里只提交 .env.example。
    env_file:
      - .env
    # 容器内**覆盖** DATABASE_URL：主机名必须是 compose 服务名 `postgres`。
    # 为什么在这里覆盖而不是让 .env 直接写 postgres：.env 里的 DATABASE_URL 是给
    # 「开发机直接跑 uv run pytest / 本地调试」用的（那时库在 127.0.0.1），
    # 而容器里的 127.0.0.1 指向应用自己。在这里覆盖后，同一份 .env 同时适用于
    # 宿主机与容器，不必维护两份配置。
    # 注意：environment 的优先级高于 env_file，所以这里的值一定会生效。
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-vs_email_forwarding}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置：请先在 .env 中填写数据库口令}@postgres:5432/${POSTGRES_DB:-vs_email_forwarding}"
    ports:
      # 宿主机端口由 .env 的 HTTP_PORT 决定，容器内固定 8000（见 Dockerfile EXPOSE）
      - "${HTTP_PORT:-8000}:8000"
    depends_on:
      postgres:
        # 等数据库真的能接受连接，而不是"容器起来了"。
        # 这样应用启动时不会因为 Postgres 还在 initdb 而反复报连接错误。
        condition: service_healthy
    # 服务器重启、容器崩溃后自动拉起（除非是运维手动 stop）
    restart: unless-stopped
    # 停服时先给应用时间收尾（asyncio 循环与 HTTP 连接的优雅关闭）
    stop_grace_period: 30s
    # 继承 Dockerfile 里的 HEALTHCHECK（用 Python 标准库打 /healthz）
    networks:
      - vs-email-forwarding

  # ---------------------------------------------------------------------------
  # 数据库：与应用同机，官方 postgres 镜像，锁主版本 17
  #   * 锁主版本而不锁 latest：17 的小版本升级是兼容的（可以直接 docker load 新
  #     小版本镜像原地替换），主版本升级需要 pg_upgrade，必须是有意识的动作。
  #   * 为什么停在 17、不跟 18：postgres:18 对数据目录做了**破坏性调整**——
  #       ENV PGDATA /var/lib/postgresql/18/docker
  #       VOLUME /var/lib/postgresql            （不再是 /var/lib/postgresql/data）
  #     也就是说 18 的挂载点与 17 不同，照抄 17 的挂载写法会把数据放到匿名卷里、
  #     出现「数据不在宿主机目录、重启后像丢库」这类事故。
  #     本项目一期不追新，继续用 17 + /var/lib/postgresql/data 的老写法（最省事、
  #     与现有运维习惯一致）。若将来要升 18，必须同时改挂载点与 README 的权限说明，
  #     并先在 docs/research/01-delivery-and-deploy.md 记录结论。
  #   * 数据落在宿主机目录 ./data/postgres（不是命名卷）：备份 = 打包该目录，
  #     运维能直接看到文件；代价是要自己处理目录属主与 SELinux 标签。
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17
    container_name: vs-email-forwarding-postgres
    # 与 app 声明同一架构，避免 amd64/arm64 混用导致数据文件不可读。
    # 同样只是**运行期保险**：架构由构建期（服务器侧构建脚本，形态仍属未定项）与交付前归档自检保证。
    # 该字段依赖 compose v2：部署时用 `docker compose version` 核对（Engine 26 自带该插件）。
    platform: linux/amd64
    restart: unless-stopped
    environment:
      # 这三个键由 compose 从 .env 插值（compose 会自动读取项目目录下的 .env），
      # 官方 postgres 镜像做 initdb 时必须拿到它们。
      # 三个键必须与 .env 里 DATABASE_URL 的用户 / 口令 / 库名一致，否则应用连不上库。
      # .env.example 已包含这三个键，照它复制即可。
      POSTGRES_USER: ${POSTGRES_USER:-vs_email_forwarding}
      # 密码没有默认值：没设就直接失败，避免悄悄用弱口令把库跑起来。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置：请先在 .env 中填写数据库口令（键名与 initdb 用的口令，必须与 DATABASE_URL 一致）}
      POSTGRES_DB: ${POSTGRES_DB:-vs_email_forwarding}
      # 应用按 UTC 存取（见 AGENTS.md §7），数据库容器也固定 UTC，避免排查时区错乱
      TZ: UTC
    # 生产**不**把 5432 暴露到宿主机。应用与库在同一个 compose 网络里，
    # 用服务名 postgres 互访即可，宿主机与外部网络都不需要这个端口。
    #
    # 如果确实要从宿主机连库排查，只绑回环地址，绝不要写 "5432:5432"
    # （那等于把数据库暴露到服务器所有网卡上）：
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      # 宿主机目录挂载（postgres:17 的数据目录是 /var/lib/postgresql/data）。
      # 首次启动前必须保证该目录存在且属主是容器内的 postgres（uid/gid 999）：
      #   mkdir -p ./data/postgres && chown -R 999:999 ./data/postgres
      # 宿主 SELinux 为 Enforcing，因此必须给该目录重打标签，这不是待确认项：
      # 用挂载选项 `:z` / `:Z`（或等价的 `chcon` 重打标签，svirt_sandbox_file_t）。
      # 结论真源在 docs/research/01-delivery-and-deploy.md。
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      # pg_isready 是官方镜像自带工具，不需要额外装包
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vs_email_forwarding} -d ${POSTGRES_DB:-vs_email_forwarding} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vs-email-forwarding

# -----------------------------------------------------------------------------
# 自定义网络：应用与数据库只在这张 bridge 网络里互访；
# 只有 app 的 HTTP_PORT 映射到宿主机，数据库不对外暴露。
# 显式命名（vs-email-forwarding-net）便于排查与将来跨 compose 接入。
# -----------------------------------------------------------------------------
networks:
  vs-email-forwarding:
    name: vs-email-forwarding-net
    driver: bridge

# 说明：本文件**故意**不声明命名卷。
#   生产数据放宿主机目录 ./data/postgres（见上），运维侧"备份/迁移"就是拷目录，
#   不需要额外理解 docker volume 的生命周期（`docker compose down -v` 不会误删数据）。
